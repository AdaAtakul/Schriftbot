name: Seite auf Cloudflare veröffentlichen

# Veröffentlicht die Seite bei jedem Push (Konfiguration: wrangler.jsonc und .assetsignore im Hauptordner).
# Braucht zwei Geheimnisse im Repo: CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID
# (GitHub: Settings → Secrets and variables → Actions). Anleitung: README, Abschnitt 1c.
on:
  push:
    branches:
      - main
      - claude/affectionate-noether-2hmp4y   # Entwicklungs-Branch; nach dem Mergen hier entfernen
    paths-ignore:
      - 'ios/**'
      - 'tests/**'
      - 'tools/**'
      - 'README.md'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
